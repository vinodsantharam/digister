# Copy to ~/.digister/config/digister.yaml (or ./config/digister.yaml) and edit.
output_dir: "~/Library/Mobile Documents/com~apple~CloudDocs/Digister"   # any folder synced to the phone
ollama:
  base_url: "http://localhost:11434"
  chat_model: "qwen3:8b"
x:
  enabled: true
  list_urls: ["https://x.com/i/lists/1234567890"]
  include_following: false        # also read the Following (chronological) timeline
  max_posts_per_run: 300
  lookback_hours: 30
  headless: true
  graphql_operations: ["ListLatestTweetsTimeline", "HomeLatestTimeline", "TweetDetail"]
youtube:
  lookback_hours: 36
  data_api_key: ""               # optional, free; leave empty to skip enrichment
digest:
  must_watch_max: 3
  mode: brief                    # brief: headlines + stories written by the model; list: one card per post
  brief_posts_max: 25            # brief mode: best posts the model reads
  brief_min_score: 5             # brief mode: posts below this score are left out
  posts_max: 20                  # list mode only
  reading_minutes: 25            # list mode only
email:
  enabled: false                 # true: email the digest every run
  to: ""                         # your address
  from: ""                       # empty = same as to
  smtp_host: smtp.gmail.com
  smtp_port: 465
  smtp_user: ""                  # empty = same as to
  # The password is never stored here: save it to ~/.digister/smtp-password (chmod 600)
